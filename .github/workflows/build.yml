name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Successive pushes to the same ref cancel superseded builds, so only the
  # HEAD commit gets the full multi-platform build (re-pushing a release tag
  # cancels the stale build the same way). Two caveats learned the hard way:
  #   - updating a ref through the REST API (PATCH /git/refs) does NOT emit a
  #     push event, so such updates never trigger this workflow — push via
  #     git, or run it manually with workflow_dispatch;
  #   - a manual workflow_dispatch on the same ref cancels an in-progress
  #     push build, by design.
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin,        name: macos-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       name: macos-arm64 }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,   name: linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     name: windows-x64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for git describe

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # On tag push, stamp the tag version into package.json, Cargo.toml and
      # tauri.conf.json so the installer package carries the correct version.
      # build.rs picks up the version from git tags automatically for the
      # binary itself. This is a build-workspace-only edit: latest.json is
      # published separately by the `release` job, because only a push to the
      # manifest branch reaches installed clients.
      - name: Stamp tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          node scripts/sync-version.mjs "$TAG_VERSION"
        shell: bash

      - uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      # The Web UI must be built before the backend: internal/server/dist is
      # the go:embed target and is gitignored, so a clean checkout fails to
      # compile without it. Its output is no longer copied into web-dist — the
      # shell's frontendDist is the tiny splash page (src-tauri/splash); the
      # embedded copy inside the backend binary is what the window actually
      # loads at http://127.0.0.1:<port>.
      - name: Build web UI
        run: |
          cd go-magic/web
          npm install
          npm run build
        shell: bash

      - name: Build backend
        run: |
          cd go-magic
          case "${{ matrix.target }}" in
            *apple-darwin*) GOARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'amd64' }}"; GOOS=darwin ;;
            *linux*)        GOARCH=amd64; GOOS=linux ;;
            *windows*)      GOARCH="${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'amd64' }}"; GOOS=windows ;;
          esac
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o go-magic$EXT ./cmd/magic
          mkdir -p ../src-tauri/resources
          cp go-magic$EXT ../src-tauri/resources/go-magic$EXT
        shell: bash

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Build Tauri
        run: |
          npm install
          cd src-tauri
          npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          echo "=== Build output tree (first 3 levels) ==="
          find src-tauri/target -maxdepth 3 -type f 2>/dev/null | head -50 || true
          echo "=== Bundle dir contents ==="
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -laR "$BUNDLE_DIR" 2>/dev/null || echo "(bundle dir not found)"
          mkdir -p bundle-output
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} bundle-output/ \;
          fi
          echo "=== Final bundle-output ==="
          ls -la bundle-output/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: go-magic-desktop-${{ matrix.name }}
          path: bundle-output/
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets
        run: |
          echo "=== Files before cleanup ==="
          ls -la release-assets/
          echo "=== Removing empty / tiny files (<= 1 byte) ==="
          find release-assets -type f -size -2c -delete
          echo "=== Files after cleanup ==="
          ls -la release-assets/
          echo "=== Generating checksums ==="
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt
          echo "=== File count: $(ls -1 | wc -l) ==="

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false

  # Publishes latest.json on the manifest branch. Without this the update
  # manifest would keep whatever version it was last committed with, and every
  # installed client would answer "already up to date" forever — no matter how
  # many releases ship.
  publish-manifest:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Write latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          NOTES="$(gh release view "$RELEASE_TAG" --json body -q .body 2>/dev/null || true)"

          node -e '
            const fs = require("fs");
            const [version, notes] = process.argv.slice(1);
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.RELEASE_TAG;
            const manifest = {
              version,
              downloadUrl: `https://github.com/${repo}/releases/tag/${tag}`,
              notes: (notes || "").trim().slice(0, 500),
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$VERSION" "$NOTES"

          cat latest.json

      - name: Commit and push manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json already points at this release; nothing to push."
            exit 0
          fi
          git commit -m "chore(release): latest.json -> ${RELEASE_TAG} [skip ci]"
          git push origin HEAD:master

      # jsDelivr caches branch files for up to a day, so the freshly pushed
      # manifest would otherwise stay invisible for a while.
      - name: Purge jsDelivr cache
        run: |
          curl -sS --max-time 30 \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@master/latest.json" || true
