name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip frontend build'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published, created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: "1"
  RUST_LOG: "info"

jobs:
  # 代码质量检查
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Auto format and commit
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with rustfmt" || echo "No changes"
            git push || echo "Push failed or no changes"
          fi

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast

  # 构建桌面应用（Windows, macOS, Linux）
  build-desktop:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: go-magic-desktop-macos-x64
            goext: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: go-magic-desktop-macos-arm64
            goext: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: go-magic-desktop-linux-x64
            goext: ""
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact_name: go-magic-desktop-linux-arm64
            goext: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: go-magic-desktop-windows-x64
            goext: ".exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "1.0.0")
            VERSION=${VERSION#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version in tauri.conf.json
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 -c "
          import json
          with open('src-tauri/tauri.conf.json', 'r') as f:
              config = json.load(f)
          config['version'] = '$VERSION'
          with open('src-tauri/tauri.conf.json', 'w') as f:
              json.dump(config, f, indent=2)
          print(f'Updated version to $VERSION')
          "
          grep '"version"' src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml
          else
            sed -i "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          echo "Updated Cargo.toml version to $VERSION"
          grep "^version" src-tauri/Cargo.toml

      - name: Checkout go-magic
        uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ========== 前端构建 ==========
      - name: Build Web UI
        shell: bash
        run: |
          cd go-magic/web
          npm install
          npm run build
          echo "=== Checking dist output ==="
          ls -la ../internal/server/dist/ || (echo "FATAL: dist not found after build!" && exit 1)

      - name: Verify web dist for Go embed
        shell: bash
        run: |
          if [ -d "go-magic/internal/server/dist" ]; then
            echo "Web dist OK: go-magic/internal/server/dist/"
            ls go-magic/internal/server/dist/ | head -5
          else
            echo "ERROR: go-magic/internal/server/dist/ not found!"
            exit 1
          fi

      - name: Copy Web Dist to Desktop Repo
        shell: bash
        run: |
          rm -rf web-dist
          cp -r go-magic/internal/server/dist web-dist/
          ls -la web-dist/

      # ========== 后端构建 ==========
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go-magic/go.sum

      - name: Build go-magic backend
        shell: bash
        env:
          EXT: ${{ matrix.goext }}
        run: |
          cd go-magic
          CGO_ENABLED=0 go build -ldflags="-s -w" -o go-magic${{ env.EXT }} ./cmd/magic
          ls -la go-magic${{ env.EXT }}

      # ========== UPX 压缩 ==========
      - name: Install UPX (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Install UPX (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install upx

      - name: Install UPX (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install upx

      - name: Compress backend with UPX
        shell: bash
        env:
          EXT: ${{ matrix.goext }}
        run: |
          echo "Before UPX:"
          ls -lh go-magic/go-magic${{ env.EXT }}
          upx --best --lzma go-magic/go-magic${{ env.EXT }} || echo "UPX failed, using uncompressed binary"
          echo "After UPX:"
          ls -lh go-magic/go-magic${{ env.EXT }}

      # ========== 打包资源 ==========
      - name: Prepare resources directory
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          ls -la src-tauri/resources/

      - name: Copy backend to resources
        shell: bash
        env:
          EXT: ${{ matrix.goext }}
        run: |
          cp go-magic/go-magic${{ env.EXT }} src-tauri/resources/go-magic${{ env.EXT }}
          ls -la src-tauri/resources/

      # ========== Linux 依赖 ==========
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libglib2.0-dev \
            libssl-dev \
            libdbus-1-dev

      - name: Install ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      # ========== Tauri 构建 ==========
      - name: Build Tauri app
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
          PKG_CONFIG_SYSROOT_DIR: /usr
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cd src-tauri && npx tauri build --target ${{ matrix.target }}

      # ========== 收集产物 ==========
      - name: Compress Tauri binary with UPX (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          BINARY="src-tauri/target/${{ matrix.target }}/release/go-magic-desktop"
          if [ -f "$BINARY" ]; then
            echo "Before UPX:"
            ls -lh $BINARY
            upx --best --lzma $BINARY || echo "UPX compression failed, using original"
            echo "After UPX:"
            ls -lh $BINARY
          fi

      - name: Prepare bundle output
        shell: bash
        run: |
          mkdir -p bundle-output

          if [ -f "src-tauri/target/${{ matrix.target }}/release/go-magic-desktop" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/go-magic-desktop bundle-output/
          fi
          if [ -f "src-tauri/target/${{ matrix.target }}/release/go-magic-desktop.exe" ]; then
            cp src-tauri/target/${{ matrix.target }}/release/go-magic-desktop.exe bundle-output/
          fi

          for dir in nsis msi deb appimage dmg; do
            if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle/$dir" ]; then
              find "src-tauri/target/${{ matrix.target }}/release/bundle/$dir" -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec cp {} bundle-output/ \;
            fi
          done

          echo "=== Bundle output ==="
          ls -la bundle-output/
          echo "=== File sizes ==="
          du -h bundle-output/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: bundle-output/*
          retention-days: 30

  # 构建 Go CLI 多平台版本
  build-go-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout go-magic
        uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go-magic/go.sum

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd go-magic/web
          npm install
          npm run build

      - name: Build Go CLI
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          cd go-magic
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o go-magic-${{ matrix.goos }}-${{ matrix.goarch }}${{ env.EXT }} ./cmd/magic

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go-magic/go-magic-*
          retention-days: 30

  # 创建发布包
  create-release:
    needs: [build-desktop, build-go-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          ls -la artifacts/

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Download Instructions

            ### Desktop Applications
            Download the appropriate installer for your platform:
            - **Windows**: `.exe` (NSIS installer) or `.msi`
            - **macOS**: `.dmg`
            - **Linux**: `.AppImage`, `.deb`

            ### CLI Tools
            Download the CLI binary for your platform:
            - `go-magic-linux-amd64`
            - `go-magic-linux-arm64`
            - `go-magic-darwin-amd64`
            - `go-magic-darwin-arm64`
            - `go-magic-windows-amd64.exe`

            ## Checksums
            Verify downloads using `checksums.txt`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}