name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin,        name: macos-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       name: macos-arm64 }
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu,   name: linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     name: windows-x64 }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Sync version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            node sync-version.mjs "${GITHUB_REF#refs/tags/v}"
          else
            node sync-version.mjs
          fi
        shell: bash

      - uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      - name: Build web UI
        run: |
          cd go-magic/web
          npm install
          npm run build
          cp -r ../internal/server/dist ../../web-dist/
        shell: bash

      - name: Build backend
        run: |
          cd go-magic
          case "${{ matrix.target }}" in
            *apple-darwin*) GOARCH="${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'amd64' }}"; GOOS=darwin ;;
            *linux*)        GOARCH=amd64; GOOS=linux ;;
            *windows*)      GOARCH="${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'amd64' }}"; GOOS=windows ;;
          esac
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o go-magic$EXT ./cmd/magic
          mkdir -p ../src-tauri/resources
          cp go-magic$EXT ../src-tauri/resources/go-magic$EXT
        shell: bash

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Build Tauri
        run: |
          npm install
          cd src-tauri
          npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        run: |
          echo "=== Build output tree (first 3 levels) ==="
          find src-tauri/target -maxdepth 3 -type f 2>/dev/null | head -50 || true
          echo "=== Bundle dir contents ==="
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls -laR "$BUNDLE_DIR" 2>/dev/null || echo "(bundle dir not found)"
          mkdir -p bundle-output
          if [ -d "$BUNDLE_DIR" ]; then
            find "$BUNDLE_DIR" -type f -exec cp {} bundle-output/ \;
          fi
          echo "=== Final bundle-output ==="
          ls -la bundle-output/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: go-magic-desktop-${{ matrix.name }}
          path: bundle-output/
          retention-days: 30
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - run: cd release-assets && sha256sum * > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true