name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip frontend build'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: go-magic-desktop-macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: go-magic-desktop-macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: go-magic-desktop-linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: go-magic-desktop-windows-x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: go-magic-desktop-windows-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using git tag version: $VERSION"
            node sync-version.mjs "$VERSION"
          else
            node sync-version.mjs
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Checkout go-magic
        uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      - name: Build Web UI
        run: |
          cd go-magic/web
          npm install
          npm run build

      - name: Copy Web Dist
        shell: bash
        run: cp -r go-magic/internal/server/dist web-dist/

      - name: Build go-magic backend
        shell: bash
        run: |
          cd go-magic
          case "${{ matrix.target }}" in
            *apple-darwin*) GOOS=darwin; GOARCH=${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'amd64' }} ;;
            *linux*) GOOS=linux; GOARCH=amd64 ;;
            *windows*) GOOS=windows; GOARCH=${{ matrix.target == 'aarch64-pc-windows-msvc' && 'arm64' || 'amd64' }} ;;
          esac
          EXT="${{ runner.os == 'Windows' && '.exe' || '' }}"
          echo "GOOS=$GOOS GOARCH=$GOARCH"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o go-magic$EXT ./cmd/magic
          mkdir -p ../src-tauri/resources
          cp go-magic$EXT ../src-tauri/resources/go-magic$EXT

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install deps & build Tauri
        run: |
          npm install
          cd src-tauri
          npm install
          npx tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p bundle-output
          cp src-tauri/target/${{ matrix.target }}/release/bundle/* bundle-output/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/go-magic-desktop* bundle-output/ 2>/dev/null || true
          ls -la bundle-output/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bundle-output/*
          retention-days: 30

  build-go-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: magicwubiao/go-magic
          path: go-magic

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: go-magic/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd go-magic/web
          npm install
          npm run build

      - name: Build CLI
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          cd go-magic
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o go-magic-${{ matrix.goos }}-${{ matrix.goarch }}${{ env.EXT }} ./cmd/magic

      - uses: actions/upload-artifact@v4
        with:
          name: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}-CLI
          path: go-magic/go-magic-*
          retention-days: 30

  release:
    needs: [build-desktop, build-go-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: false