<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Magic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #f5f6f8;
      font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
      color: #333;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      user-select: none;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .title { font-size: 18px; font-weight: 600; }
    .hint { font-size: 13px; color: #888; }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #dcdfe6;
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.svg" alt="Go Magic" />
    <div class="title">Go Magic</div>
    <div class="spinner"></div>
    <div class="hint" id="hint"></div>
  </div>
  <!--
    脚本外置（splash.js）：CSP 的 script-src 只有 'self'，内联脚本会被拦截。
    页面文案跟随系统语言；启动进度来自外壳的 backend-status 事件。
  -->
  <script src="splash.js"></script>
</body>
</html>
