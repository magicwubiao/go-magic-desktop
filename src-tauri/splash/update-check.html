<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Go Magic Update Check</title>
</head>
<body>
  <!--
    隐藏的更新检查页（方案 C：版本检查 + 跳转下载页）。

    之所以不用 splash 页做这件事：后端热启动时端口几乎立即绑定，
    splash 页存活时间极短，fetch 大概率被随后的导航打断。这个页面由
    Rust 侧在 setup 阶段以隐藏窗口（visible: false）加载，完全独立于
    主窗口的生命周期，每次启动都能可靠跑完检查。

    流程：fetch 静态清单（UPDATE_MANIFEST_URLS，逐源尝试）→ 与 get_app_info 的
    当前版本比对 → 有新版才调用 notify_update_available（原生弹窗 +
    打开系统浏览器下载页）。无论结果如何最后调用 update_check_finished
    让 Rust 侧关闭本隐藏窗口（另有超时兜底）。

    外壳刻意不引入 HTTP 客户端与 TLS crate（见 README 安全模型），
    远程请求全部由 webview 网络栈完成；任何失败都静默跳过。
  -->
  <script>
    (function () {
      // 更新清单地址：任何返回 JSON 的静态 URL 均可（GitHub Raw、自有
      // 服务器、OSS/CDN）。发版时由 `scripts/sync-version.mjs` 同步
      // latest.json 的 version 字段，推送到该 URL 指向的分支即可触达用户。
      // 注意分支名必须与仓库默认分支一致（当前为 master）。
      // 按顺序依次尝试：jsDelivr 对国内网络友好，GitHub Raw 作为兜底；
      // 任一源成功即停止，全部失败才上报 error。
      var UPDATE_MANIFEST_URLS = [
        "https://cdn.jsdelivr.net/gh/magicwubiao/go-magic-desktop@master/latest.json",
        "https://fastly.jsdelivr.net/gh/magicwubiao/go-magic-desktop@master/latest.json",
        "https://raw.githubusercontent.com/magicwubiao/go-magic-desktop/master/latest.json",
      ];
      // 每个源的拉取上限 8 秒；兜底关闭由 Rust 侧的 UPDATE_CHECK_MAX_LIFETIME 控制。
      var FETCH_TIMEOUT_MS = 8000;

      var tauri = window.__TAURI__;
      var canInvoke = tauri && tauri.core && typeof tauri.core.invoke === "function";

      function finish(status) {
        if (canInvoke) {
          tauri.core
            .invoke("update_check_finished", { status: status })
            .catch(function () {});
        }
      }

      // "1.2.3" / "v1.2.3" -> [1, 2, 3]；非数字段按 0 处理。
      function parseVersion(v) {
        return String(v || "")
          .trim()
          .replace(/^v/i, "")
          .split(".")
          .map(function (n) { return parseInt(n, 10) || 0; });
      }

      function isNewer(latest, current) {
        var a = parseVersion(latest);
        var b = parseVersion(current);
        var len = Math.max(a.length, b.length);
        for (var i = 0; i < len; i++) {
          var diff = (a[i] || 0) - (b[i] || 0);
          if (diff !== 0) return diff > 0;
        }
        return false;
      }

      // 逐个源尝试拉取清单；某个源网络失败（含超时）则换下一个。
      function fetchManifest(urls) {
        if (!urls.length) {
          return Promise.reject(new Error("all manifest sources failed"));
        }
        var url = urls[0] + "?t=" + Date.now();
        return fetch(url, { signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) })
          .then(function (res) {
            if (!res.ok) throw new Error("manifest HTTP " + res.status);
            return res.json();
          })
          .catch(function () {
            return fetchManifest(urls.slice(1));
          });
      }

      function check() {
        if (!canInvoke) return;

        tauri.core
          .invoke("get_app_info")
          .then(function (info) {
            if (!info || !info.version) throw new Error("no app version");
            return fetchManifest(UPDATE_MANIFEST_URLS).then(function (manifest) {
              if (!manifest || typeof manifest.version !== "string") {
                throw new Error("bad manifest");
              }
              if (!isNewer(manifest.version, info.version)) {
                return "up-to-date";
              }
              return tauri.core
                .invoke("notify_update_available", {
                  notice: {
                    currentVersion: info.version,
                    latestVersion: manifest.version,
                    downloadUrl:
                      typeof manifest.downloadUrl === "string"
                        ? manifest.downloadUrl
                        : "",
                    notes: typeof manifest.notes === "string" ? manifest.notes : "",
                  },
                })
                .then(function () { return "updated"; });
            });
          })
          .then(finish, function () {
            // 网络不通、清单缺失等——手动检查时原生侧会提示失败。
            finish("error");
          });
      }

      check();
    })();
  </script>
</body>
</html>
