<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Go Magic Update Check</title>
</head>
<body>
  <!--
    隐藏的更新检查页（方案 C：版本检查 + 跳转下载页）。

    检查逻辑在 update-check.js：由 Rust 侧在 setup 阶段以隐藏窗口
    （visible: false）加载，独立于主窗口生命周期，每次启动都能可靠跑完。
    脚本外置使 CSP 的 script-src 可以保持 'self'，不再需要 'unsafe-inline'。
  -->
  <script src="update-check.js"></script>
</body>
