[package]
name = "go-magic-desktop"
version = "0.4.15"
description = "Go Magic Desktop App - Tauri"
authors = ["Go Magic Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["devtools"] }
tauri-plugin-shell = "2.1"
tauri-plugin-fs = "2.1"
tauri-plugin-os = "2.1"
tauri-plugin-process = "2.1"
tauri-plugin-log = "2.1"
tauri-plugin-dialog = "2.1"
tauri-plugin-http = "2.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
chrono = "0.4"
open = "5"
time = "=0.3.36"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true